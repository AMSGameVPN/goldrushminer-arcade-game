const rand=(lo,hi)=>lo+Math.random()*(hi-lo);
const money=n=>'$'+n.toLocaleString('en-US');
const pickups=[],particles=[],flakes=[];
let phase='ready',mode='swing',angle=0,arc=0,length=23,held=null;
let round=1,score=0,wallet=100,target=650,roundBase=0,remaining=60,bombs=1,power=0,grip=0;
let best=0,sound=true,audio,stock=[],last=0,noticeUntil=0,popup=null,flash=0;
try{best=Number(localStorage.vegasBest)||0;sound=localStorage.vegasSound!=='off'}catch{}
const catalog=[
 {id:'dynamite',name:'Dynamite',desc:'Blast away a heavy catch.',price:45,buy:()=>bombs++},
 {id:'claw',name:'Wide claw',desc:'Grab treasure with a wider reach.',price:100,buy:()=>grip++},
 {id:'reel',name:'Power reel',desc:'Haul every catch back faster.',price:85,buy:()=>power++},
 {id:'clock',name:'Pocket watch',desc:'Add 12 seconds to this round.',price:65,buy:()=>remaining+=12},
 {id:'strength',name:'Strength tonic',desc:'Boost your hauling power.',price:70,buy:()=>power+=0.65}
];
function icon(c,type){c.width=c.height=48;sprite(c.getContext('2d'),type,24,24,46)}
document.querySelectorAll('[data-sprite]').forEach(c=>icon(c,c.dataset.sprite));
function tone(freq,end,dur=0.1,wave='square',delay=0,vol=0.035){
 if(!sound||!audio)return;
 const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();
 o.type=wave;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(end,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.02)
}
function unlock(){try{audio||=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{}}
function chime(){tone(520,660,.10,'triangle');tone(780,1050,.19,'triangle',.08,.08)}
function refresh(){
 for(const [id,v] of Object.entries({round:String(round).padStart(2,'0'),score:money(score),target:money(target),time:Math.floor(Math.ceil(remaining)/60)+':'+String(Math.ceil(remaining)%60).padStart(2,'0'),wallet:money(wallet),count:'× '+bombs,best:money(best)}))$(id).textContent=v;
 $('time').classList.toggle('danger',remaining<=10);
 $('sound').querySelector('b').textContent=sound?'Sound on':'Sound off';
 $('sound').setAttribute('aria-pressed',sound);
 $('pause').disabled=phase!=='playing';
}
function note(msg){$('notice').textContent=msg;noticeUntil=performance.now()+1900}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function shop(){
 stock=shuffle([...catalog]).slice(0,3);
 $('stock').replaceChildren();
 for(const item of stock){
 const b=document.createElement('button');b.className='item';b.innerHTML='<span class="iconbox"><canvas></canvas></span><span><h3>'+item.name+'</h3><p>'+item.desc+'</p><span class="price">'+money(item.price)+'</span></span>';
 icon(b.querySelector('canvas'),item.id);
 b.onclick=()=>{unlock();if(phase!=='ready'&&phase!=='playing')return;if(wallet<item.price){note('Need '+money(item.price-wallet)+' more');tone(150,100);return}
 wallet-=item.price;item.buy();b.disabled=true;b.querySelector('.price').textContent='Sold';refresh();chime();note(item.name+' purchased')};
 $('stock').append(b)
 }
}

 // Stratify positions across the mine, leaving a navigable gap between neighboring objects.
 for(let i=0;i<types.length;i++){
 const type=types[i],size=type==='gold'?rand(17,41):type==='rock'?rand(16,31):rand(15,22);
 const x=rand(24,52)+(i%4)*144+rand(0,70),y=110+Math.floor(i/4)*49+rand(-8,9);
 const value=type==='gold'?Math.round(size*5/10)*10:type==='gem'?300:type==='bag'?Math.floor(rand(9,38))*10:15;
 pickups.push({type,x,y,size,value})
 }
 for(let i=0;i<100;i++)flakes.push([rand(0,600),rand(86,300),rand(1,3)]);
 arc=rand(-.5,.5);length=23;mode='swing';held=null;popup=null;flash=0;
}
function prepare(){
 phase='ready';roundBase=score;target=roundBase+Math.min(650+(round-1)*100,1450);remaining=60;
 $('place').textContent=['Red Rock Canyon','Coyote Ridge','Sunset Gulch','Copper Creek'][(round-1)%4].toUpperCase();
 $('begin').hidden=false;$('notice').textContent='';mine();shop();refresh()
}
function start(){if(phase!=='ready')return;unlock();phase='playing';$('begin').hidden=true;refresh();tone(300,500,.16,'triangle')}
function cast(){if($('dialog').open)return;if(phase==='ready')start();if(phase!=='playing'||mode!=='swing')return;mode='out';tone(570,145,.18,'sawtooth',0,.018)}
function endpoint(){return{x:300+Math.sin(angle)*length,y:80+Math.cos(angle)*length}}
function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,dx:rand(-45,45),dy:rand(-75,5),life:rand(.3,.65),color})}
function blast(){unlock();if(phase!=='playing'||$('dialog').open)return;if(!bombs){note('Out of dynamite');return}if(!held){note('Use dynamite while hauling a catch');return}
 const {x,y}=endpoint();bombs--;held=null;burst(x,y,'#ffc15a',34);flash=.09;tone(120,20,.45,'sawtooth',0,.12);refresh()
}
function dialog(title,body,buttons){
 const el=$('dialogContent');el.replaceChildren();const h=document.createElement('h2'),p=document.createElement('p');h.textContent=title;p.textContent=body;el.append(h,p);
 for(const [label,fn] of buttons){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{$('dialog').close();fn()};el.append(b)}
 $('dialog').showModal()
}
function pause(help=false){if($('dialog').open)return;
 const before=phase;phase='paused';dialog(help?'How to play':'Mine paused',help?'Aim with the swinging claw. Click the mine or press ↓ to drop it. Heavy catches take longer to haul. Press ↑ or tap the dynamite counter to destroy a catch. Reach the target before time runs out. Spend your wallet at the supply post.':'Your timer is paused.',[[help?'Got it':'Resume mining',()=>{phase=before;refresh()}]])
}
function finish(){
 phase='end';refresh();const won=score>=target;
 if(won)chime();else tone(240,90,.45,'triangle',0,.08);
 dialog(won?'Claim complete!':'Shift’s over',won?'You hauled in '+money(score-roundBase)+' this round. A fresh mine and new supplies are waiting.':'Your haul reached '+money(score)+' against a target of '+money(target)+'.',[[won?'Next round':'Play again',()=>{
 if(won){round++}else{round=1;score=0;wallet=100;bombs=1;power=grip=0}prepare()
 }]])
}
function update(dt){
 if(phase==='ready'||phase==='playing'){if(mode==='swing'){arc+=dt*1.45;angle=Math.sin(arc)*1.48}}
 if(phase!=='playing')return;
 const prev=Math.ceil(remaining);remaining=Math.max(0,remaining-dt);
 if(Math.ceil(remaining)!==prev){refresh();if(remaining<=5&&remaining>0)tone(480,360,.05,'square',0,.016)}
 if(remaining<=0){finish();return}
 if(mode==='out'){
 length+=dt*197;const p=endpoint();
 const hit=pickups.find(o=>Math.hypot(o.x-p.x,o.y-p.y)<o.size*.40+4+Math.min(grip,6)*2);
 if(hit){held=hit;pickups.splice(pickups.indexOf(hit),1);mode='in';tone(190,90,.08,'triangle',0,.13)}
 else if(p.x<=4||p.x>=596||p.y>=297){mode='in';tone(130,95,.05)}
 }else if(mode==='in'){
 const speed=held?(held.type==='rock'?36:held.type==='gold'?67-(held.size-17)*.75:92):178;
 length-=dt*speed*(1+Math.min(power,10)*.32);
 if(length<=23){length=23;mode='swing';if(held){
 score+=held.value;wallet+=held.value;popup={value:held.value,life:1.0};burst(300,97,'#ffd777',11);held=null;chime();
 if(score>best){best=score;try{localStorage.vegasBest=best}catch{}}
 refresh();if(score>=target){finish();return}
 }}
 }
}
function draw(dt){
 ctx.imageSmoothingEnabled=false;if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0);else{ctx.fillStyle='#743e2b';ctx.fillRect(0,0,600,300)}
 ctx.fillStyle='rgba(232,153,91,.14)';for(const [x,y,s] of flakes)ctx.fillRect(x|0,y|0,s|0,1);
 for(const o of pickups)sprite(ctx,o.type,o.x,o.y,o.size);
 const p=endpoint();
 ctx.lineWidth=2;ctx.strokeStyle='#382719';ctx.beginPath();ctx.moveTo(300,79);ctx.lineTo(p.x,p.y);ctx.stroke();
 ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));ctx.rotate(-angle);
 if(held)sprite(ctx,held.type,0,7,held.size);
 ctx.lineJoin='miter';for(const [color,width] of [['#30251f',3.8],['#d8c6a0',1.6]]){ctx.strokeStyle=color;ctx.lineWidth=width;
 for(const sign of [-1,1]){ctx.beginPath();ctx.moveTo(0,-3);ctx.lineTo(sign*5,0);ctx.lineTo(sign*(held?6:8),5);ctx.lineTo(sign*(held?3:5),9);ctx.stroke()}}
 ctx.fillStyle='#473b30';ctx.fillRect(-2,-5,4,5);ctx.restore();
 if(phase!=='paused'){for(let i=particles.length-1;i>=0;i--){const e=particles[i];e.life-=dt;e.x+=e.dx*dt;e.y+=e.dy*dt;e.dy+=dt*130;if(e.life<=0)particles.splice(i,1)}}
 for(const e of particles){ctx.fillStyle=e.color;ctx.fillRect(e.x|0,e.y|0,2,2)}
 if(popup){ctx.font='bold 11px monospace';ctx.fillStyle='#ffdf78';ctx.fillText('+'+money(popup.value),313,90+popup.life*9);if(phase!=='paused')popup.life-=dt;if(popup.life<0)popup=null}
 if(flash>0){ctx.fillStyle='rgba(255,198,95,.28)';ctx.fillRect(0,0,600,300);flash-=dt}
}
function frame(now){const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw(dt);if(noticeUntil&&now>noticeUntil){$('notice').textContent='';noticeUntil=0}requestAnimationFrame(frame)}
$('begin').onclick=start;canvas.onclick=cast;$('blast').onclick=blast;$('help').onclick=()=>pause(true);$('pause').onclick=()=>pause();
$('sound').onclick=()=>{sound=!sound;unlock();try{localStorage.vegasSound=sound?'on':'off'}catch{}refresh();tone(420,680,.1,'triangle')};
$('dialog').addEventListener('cancel',e=>{e.preventDefault();if(phase==='paused')$('dialogContent').querySelector('button').click()});
document.addEventListener('keydown',e=>{if($('dialog').open||e.repeat)return;
 if(e.key==='ArrowDown'||(e.code==='Space'&&document.activeElement.tagName!=='BUTTON')){e.preventDefault();cast()}
 else if(e.key==='ArrowUp'){e.preventDefault();blast()}else if((e.key==='p'||e.key==='Escape')&&phase==='playing')pause()
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='playing')pause()});
prepare();requestAnimationFrame(frame);
</script></body></html>
